<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trò Chơi Siêu Nhân</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>
    <div class="container">

        <header class="header">
            <div class="header-icon">
                <span role="img" aria-label="superhero">🦸‍♂️</span>
            </div>
            <div class="header-content">
                <h1 class="title">NHÓM 1 RẤT VUI ĐƯỢC GẶP CÁC BẠN!!!</h1>
                <a href="js.html" class="start-button-in-header">
                    <button id="btnStartIntro">START</button>
                </a>
            </div>
            <div class="header-icon">
                <span role="img" aria-label="superhero">🦸‍♀️</span>
            </div>
        </header>

        <main class="main-content">
            <img src="anhnensieunhan.jpg" alt="Nhóm Power Rangers" class="main-image">
        </main>

        <div class="dot dot-1"></div>
        <div class="dot dot-2"></div>
        <div class="dot dot-3"></div>
        <div class="dot dot-4"></div>

    </div>

    <script>
        // 1. Bắn pháo giấy nhẹ nhàng khi vừa vào trang
        window.addEventListener('load', () => {
            var duration = 2000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 3,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#ff0000', '#ffd700'] // Đỏ vàng
                });
                confetti({
                    particleCount: 3,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#0000ff', '#00ff00'] // Xanh
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        });
    </script>
</body>

</html>
